---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/leohike/aurora-max
name: aurora-max
description: Aurora DX with Kvantum, snapper and a native Steam stack baked in, so nothing has to be layered.

# Aurora DX, KDE developer image. `stable` is the weekly, kernel-gated stream.
base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

# module configuration, executed in order
modules:
  # everything the two images share: packages, Steam, Wine
  - from-file: common.yml

  # sets up the policy & signing files so signed images verify properly
  - type: signing
