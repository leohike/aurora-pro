name: bluebuild
on:
  schedule:
    # Cheap check every 2 hours; the image is only built when the
    # fingerprint (.github/scripts/fingerprint.sh) differs from the one on the
    # published image. GitHub only fires schedules on the default branch --
    # a dev branch is driven by .github/workflows/schedule-dev.yml on main.
    - cron: "0 */2 * * *"
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
    inputs:
      force:
        description: Build even if nothing changed
        type: boolean
        default: true
concurrency:
  # only run one build at a time. Never cancel one in progress: a push or the
  # next check would otherwise kill a running build.
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aurora-pro
  # the tag the gate compares against: :latest on main, :<branch> elsewhere
  TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
jobs:
  gate:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute fingerprint
        id: fingerprint
        run: echo "fingerprint=$(.github/scripts/fingerprint.sh recipes/recipe.yml)" >> "$GITHUB_OUTPUT"

      - name: Compare with published image
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          published=$(skopeo inspect --no-tags "docker://$IMAGE:$TAG" 2>/dev/null \
            | jq -r '.Labels["org.aurora-pro.fingerprint"] // empty' || true)
          echo "fingerprint: $FINGERPRINT"
          echo "published:   ${published:-<none>} ($IMAGE:$TAG)"
          if [[ $EVENT == pull_request || ($EVENT == workflow_dispatch && $FORCE == true) ]]; then
            build=true
          elif [[ $FINGERPRINT != "$published" ]]; then
            build=true
          else
            build=false
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  bluebuild:
    name: Build Custom Image
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - uses: actions/checkout@v7

      # The next gate reads this label back from the published image.
      - name: Stamp fingerprint into the recipe
        env:
          FINGERPRINT: ${{ needs.gate.outputs.fingerprint }}
          RECIPE: recipes/${{ matrix.recipe }}
        run: yq -i '.labels["org.aurora-pro.fingerprint"] = strenv(FINGERPRINT)' "$RECIPE"

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # keep the stamped recipe from the step above
          skip_checkout: true

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

      # Off the default branch BlueBuild only tags br-<branch>-<fedora>. Point a
      # plain :<branch> at the same digest; the cosign signature is keyed by
      # digest, so it verifies under the new tag too.
      - name: Tag as :${{ env.TAG }}
        if: github.event_name != 'pull_request' && github.ref_name != 'main'
        env:
          FINGERPRINT: ${{ needs.gate.outputs.fingerprint }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          RECIPE: recipes/${{ matrix.recipe }}
        run: |
          fedora=$(skopeo inspect --no-tags "docker://$(yq '.["base-image"]' "$RECIPE"):$(yq '.["image-version"]' "$RECIPE")" \
            | jq -r '.Labels["org.opencontainers.image.version"]' | cut -d. -f1)
          src="$IMAGE:br-${REF_NAME//\//_}-$fedora"
          got=$(skopeo inspect --no-tags "docker://$src" | jq -r '.Labels["org.aurora-pro.fingerprint"] // empty')
          if [[ $got != "$FINGERPRINT" ]]; then
            echo "::error::$src carries fingerprint '$got', expected '$FINGERPRINT'"
            exit 1
          fi
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
          skopeo copy --preserve-digests "docker://$src" "docker://$IMAGE:$TAG"
